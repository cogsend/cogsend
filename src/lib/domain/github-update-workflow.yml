# Installs a CogSend release into this repository; Workers Builds then deploys
# the commit, the same way it deployed this copy in the first place.
#
# Actions → Update CogSend → Run workflow. Leave the tag empty for the latest
# release. Every file is checked against the release's signature first
# (lib/update-from-release.mjs), and a mismatch stops before anything is
# committed.
#
# Automatic updates: add the repository variable AUTO_UPDATE with the value
# true (Settings → Secrets and variables → Actions → Variables). A daily run
# then installs patch releases (1.15.0 → 1.15.1); anything bigger still waits
# for Run workflow.
#
# Version 2 of this file, from CogSend 1.15.0.
name: Update CogSend

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to install, like v1.14.0. Empty for the latest.
        required: false
        default: ''
      rollback:
        description: Roll back (allow a release older than this repository holds)
        type: boolean
        default: false
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: write

concurrency:
  group: update-cogsend
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'schedule' || vars.AUTO_UPDATE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # A copy installed before 1.14.0 has no updater of its own. It takes it
      # once from cogsend/deploy, where the Deploy button installed it from
      # (main, or next while only a pre-release has one); every later update
      # runs the copy's own, signed with the release.
      - name: Fetch the updater (first update of an older copy)
        run: |
          if [ ! -f lib/update-from-release.mjs ]; then
            for ref in main next; do
              ok=true
              for f in update-from-release.mjs github-update.mjs deployed-version.mjs release-keys.json; do
                curl -fsSL "https://raw.githubusercontent.com/cogsend/deploy/$ref/lib/$f" -o "lib/$f" || ok=false
              done
              if [ "$ok" = true ]; then break; fi
            done
            test -f lib/update-from-release.mjs
          fi
      # A daily run needs an updater that knows to stop at patch releases;
      # one from before 1.15.0 would install whatever is latest.
      - id: patch-aware
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] && ! grep -q PATCH_ONLY lib/update-from-release.mjs; then
            echo "This copy's updater predates automatic updates: run the action by hand once."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - id: update
        if: steps.patch-aware.outputs.skip != 'true'
        run: node lib/update-from-release.mjs
        env:
          TAG: ${{ inputs.tag }}
          ROLLBACK: ${{ inputs.rollback }}
          PATCH_ONLY: ${{ github.event_name == 'schedule' }}
      - if: steps.update.outputs.changed == 'true'
        env:
          TAG: ${{ steps.update.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit --quiet -m "CogSend $TAG"
          git push --quiet
